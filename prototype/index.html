<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameCapture — Guided Stage prototype</title><link rel="stylesheet" href="style.css"></head><body>
<header><button class="brand" data-go="capture"><span class="brand-icon">◧</span> FrameCapture</button><div class="header-right"><span class="prototype">Interactive prototype</span><button class="quiet" data-go="library">My captures <span>↗</span></button></div></header>
<main id="app"></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="source-dialog"><form method="dialog"><div class="dialog-title"><div><span class="eyebrow">SIMULATED BROWSER PICKER</span><h2>Choose what to share</h2></div><button class="icon" aria-label="Close source picker">×</button></div><p class="muted">The working app will open your browser’s own sharing window.</p><div class="segmented" id="source-tabs"><button type="button" data-source="Browser tab" aria-pressed="true">Browser tab</button><button type="button" data-source="Window">Window</button><button type="button" data-source="Entire screen">Entire screen</button></div><button type="button" id="source-card" class="source-card"><div class="source-mini">&lt;/&gt;<br><small>React tutorial</small></div><span id="source-name">React tutorial — Browser tab</span><span class="selected-check">✓</span></button><label class="check"><input id="share-audio" type="checkbox" checked> Include available source audio</label><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button type="button" id="confirm-source" class="primary">Use this source</button></div><details><summary>Preview a permission error</summary><button type="button" id="deny-source" class="quiet">Simulate denied permission</button></details></form></dialog>
<script src="app.js"></script></body></html>
