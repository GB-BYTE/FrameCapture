<!doctype html><meta charset="utf-8"><title>FrameCapture retention checks</title><h1>Retention checks - isolated test library</h1><button id="run">Run expiry checks</button><pre id="results">Ready</pre><script type="module">
import {saveCapture,getCapture,listCaptures,purgeExpired,deleteCapture,RETENTION_MS} from '/storage.mjs';
const log=s=>document.querySelector('#results').textContent+='\n'+s;
document.querySelector('#run').onclick=async()=>{const ids=['expiry-'+crypto.randomUUID(),'fresh-'+crypto.randomUUID(),'image-'+crypto.randomUUID()];try{const now=Date.now(),blob=new Blob(['test bytes']);const old={id:ids[0],kind:'video',created:now-RETENTION_MS-1,blob,cameraBlob:blob,title:'Expired test'};const d=await new Promise((resolve,reject)=>{const q=indexedDB.open('framecapture-local',1);q.onupgradeneeded=()=>q.result.createObjectStore('captures',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});await new Promise((resolve,reject)=>{const t=d.transaction('captures','readwrite');t.objectStore('captures').put(old);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});d.close();const fresh={id:ids[1],kind:'video',created:now,savedAt:now,blob,title:'Fresh test'};await saveCapture(fresh);await saveCapture({...fresh,savedAt:now+999999,title:'Edited title'});if((await getCapture(ids[1])).savedAt!==now)throw Error('Editing extended expiry');await saveCapture({id:ids[2],kind:'image',created:now-RETENTION_MS*2,blob});const removed=await purgeExpired(now);if(!removed.includes(ids[0])||await getCapture(ids[0]))throw Error('Old video retained');if(!await getCapture(ids[1])||!await getCapture(ids[2]))throw Error('Fresh video or screenshot removed');let rejected=false;try{await saveCapture(old);}catch(e){rejected=e.name==='CaptureExpiredError';}if(!rejected)throw Error('Expired copy resurrected');const rows=await listCaptures({metadataOnly:true});if(rows.some(e=>'blob' in e||'cameraBlob' in e))throw Error('Library includes full media blobs');log('PASS expiry, edit timestamp preservation, legacy handling, screenshot exclusion, anti-resurrection, metadata-only listing');}catch(e){log('FAIL '+e.stack)}finally{for(const id of ids)await deleteCapture(id);}};
</script>
